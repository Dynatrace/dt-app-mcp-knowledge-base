name: Link check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linkcheck:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Check Markdown and workflow files; skip generated output
          args: >-
            --verbose
            --no-progress
            --exclude-path docs
            --exclude-path meta.json
            '**/*.md'
            '**/*.yml'
          fail: true
